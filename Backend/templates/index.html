<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Interactive Page Boilerplate">
	<title>Interactive Page</title>

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

	<style>
		/* Design Tokens & CSS Reset */
		:root {
			--font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
			--bg-base: #0a0d14;
			--text-primary: #f8fafc;
			--text-muted: #a78bfa;
		}

		*, *::before, *::after {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			font-family: var(--font-main);
			color: var(--text-primary);
			background-color: var(--bg-base);
			overflow-x: hidden;
			-webkit-font-smoothing: antialiased;
		}

		/* Background Interactive Canvas */
		#bg-canvas {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			z-index: 0;
			pointer-events: none;
		}

		/* Main Content Layout Overlay Container */
		.page-container {
			position: relative;
			z-index: 1;
			flex: 1;
			width: 100%;
			max-width: 1200px;
			margin: 0 auto;
			padding: clamp(24px, 5vw, 64px) 20px;
		}
	</style>
</head>
<body>

	<!-- Interactive Particle Background -->
	<canvas id="bg-canvas"></canvas>

	<!-- Main Content Container -->
	<main class="page-container">

    {% block content %}
    {% endblock %}

	</main>

	<!-- Interactive Background Script -->
	<script>
		const canvas = document.getElementById('bg-canvas');
		const ctx = canvas.getContext('2d');

		let width = canvas.width = window.innerWidth;
		let height = canvas.height = window.innerHeight;

		const mouse = { x: width / 2, y: height / 2, radius: 150 };

		window.addEventListener('resize', () => {
			width = canvas.width = window.innerWidth;
			height = canvas.height = window.innerHeight;
			initParticles();
		});

		window.addEventListener('mousemove', (e) => {
			mouse.x = e.clientX;
			mouse.y = e.clientY;
		});

		window.addEventListener('touchmove', (e) => {
			if (e.touches.length > 0) {
				mouse.x = e.touches[0].clientX;
				mouse.y = e.touches[0].clientY;
			}
		});

		class Particle {
			constructor() {
				this.x = Math.random() * width;
				this.y = Math.random() * height;
				this.vx = (Math.random() - 0.5) * 0.8;
				this.vy = (Math.random() - 0.5) * 0.8;
				this.radius = Math.random() * 2 + 1;
				this.baseAlpha = Math.random() * 0.5 + 0.2;
			}

			update() {
				this.x += this.vx;
				this.y += this.vy;

				if (this.x < 0 || this.x > width) this.vx *= -1;
				if (this.y < 0 || this.y > height) this.vy *= -1;
			}

			draw() {
				ctx.beginPath();
				ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
				ctx.fillStyle = `rgba(192, 132, 252, ${this.baseAlpha})`;
				ctx.fill();
			}
		}

		let particles = [];
		function initParticles() {
			particles = [];
			const particleCount = Math.floor((width * height) / 12000);
			for (let i = 0; i < particleCount; i++) {
				particles.push(new Particle());
			}
		}

		function animate() {
			ctx.clearRect(0, 0, width, height);

			for (let i = 0; i < particles.length; i++) {
				particles[i].update();
				particles[i].draw();

				// Connect particles to mouse
				const dxMouse = mouse.x - particles[i].x;
				const dyMouse = mouse.y - particles[i].y;
				const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

				if (distMouse < mouse.radius) {
					ctx.beginPath();
					ctx.moveTo(particles[i].x, particles[i].y);
					ctx.lineTo(mouse.x, mouse.y);
					ctx.strokeStyle = `rgba(168, 85, 247, ${1 - distMouse / mouse.radius})`;
					ctx.lineWidth = 0.8;
					ctx.stroke();
				}

				// Connect nearby particles to each other
				for (let j = i + 1; j < particles.length; j++) {
					const dx = particles[i].x - particles[j].x;
					const dy = particles[i].y - particles[j].y;
					const dist = Math.sqrt(dx * dx + dy * dy);

					if (dist < 100) {
						ctx.beginPath();
						ctx.moveTo(particles[i].x, particles[i].y);
						ctx.lineTo(particles[j].x, particles[j].y);
						ctx.strokeStyle = `rgba(147, 51, 234, ${0.15 * (1 - dist / 100)})`;
						ctx.lineWidth = 0.5;
						ctx.stroke();
					}
				}
			}

			requestAnimationFrame(animate);
		}

		initParticles();
		animate();
	</script>
</body>
</html>
