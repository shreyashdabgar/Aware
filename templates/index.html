<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Academic Excellence & Elite AI Tutoring">
    <title>{% block title %}Academic Excellence | Private Tutoring{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Three.js Library for 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* Design Tokens - Light Sage & Mint Palette */
        :root {
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
            
            --bg-sage-light: #D8E2DC;          /* Base Light Sage Background */
            --card-mint-light: rgba(222, 234, 232, 0.75); 
            --card-white: rgba(255, 255, 255, 0.85);      
            
            --accent-eucalyptus: #97B1A6;      /* Highlight Color */
            --accent-sage: #B1C9BE;            /* Soft Sage Accent */
            --accent-btn: #A3C4B5;             /* Button Base */
            --accent-btn-hover: #8EAFA0;       /* Darker Sage Hover */
            
            --text-primary: #11382B;           /* Deep Forest Green */
            --text-body: #2D4A3E;              /* Readable Medium Forest */
            --text-muted: #5C7368;             /* Muted Grey-Green */
            
            --border-subtle: rgba(17, 56, 43, 0.08);
            --border-hover: rgba(151, 177, 166, 0.4);
            --shadow-soft: 0 10px 30px rgba(17, 56, 43, 0.05);
            
            --radius-md: 14px;
            --radius-lg: 24px;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--font-sans);
            color: var(--text-body);
            background-color: var(--bg-sage-light);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 3D Canvas Background Layer */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient Micro-Dot Overlay */
        .classy-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
            background-image: radial-gradient(circle at 50% 50%, #11382B 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Page Content Overlay Container */
        .page-container {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(24px, 4vw, 48px) 24px;
        }
    </style>
</head>
<body>

    <!-- Background Pattern Overlay -->
    <div class="classy-overlay"></div>

    <!-- 3D Background Canvas -->
    <div id="canvas-container"></div>

    <!-- Main Content Injection Block -->
    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Interactive 3D Canvas Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('canvas-container');

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xD8E2DC, 0.02);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 14);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            // Palette-matched Materials
            const matBaseWhite = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, flatShading: true });
            const matMint = new THREE.MeshPhongMaterial({ color: 0xDEEAE8, flatShading: true });
            const matSage = new THREE.MeshPhongMaterial({ color: 0x97B1A6, flatShading: true });
            const matWireframe = new THREE.MeshBasicMaterial({ color: 0x97B1A6, wireframe: true, transparent: true, opacity: 0.35 });

            const group3D = new THREE.Group();

            // 1. Isometric Floor Grid
            const gridHelper = new THREE.GridHelper(30, 30, 0x97B1A6, 0xDEEAE8);
            gridHelper.position.y = -3.5;
            group3D.add(gridHelper);

            // 2. Floating AI Geometry Elements
            const bLeft = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), matSage);
            const bLeftWire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), matWireframe);
            bLeftWire.scale.set(1.2, 1.2, 1.2);
            
            const groupLeft = new THREE.Group();
            groupLeft.add(bLeft, bLeftWire);
            groupLeft.position.set(-6, 1, -2);
            group3D.add(groupLeft);

            const bRight1 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), matBaseWhite);
            bRight1.position.set(6, 1.5, -2);
            
            const bRight2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8), matMint);
            bRight2.position.set(5.5, -1, 0);

            group3D.add(bRight1, bRight2);
            scene.add(group3D);

            // Interactive Parallax Mouse Controls
            let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            let clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();

                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;

                groupLeft.rotation.y = elapsedTime * 0.4;
                bRight1.rotation.x = elapsedTime * 0.3;
                bRight1.rotation.y = elapsedTime * 0.3;

                groupLeft.position.y = Math.sin(elapsedTime * 1.5) * 0.3 + 1;
                bRight1.position.y = Math.cos(elapsedTime * 1.2) * 0.25 + 1.5;

                group3D.rotation.y = targetX * 0.2;
                group3D.rotation.x = targetY * 0.1;

                renderer.render(scene, camera);
            }

            animate();
        });
    </script>
</body>
</html>
