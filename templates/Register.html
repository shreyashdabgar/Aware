{% extends "index.html" %}

{% block content %}
<style>
    /* Design Tokens - Light Sage, Mint & Eucalyptus Palette */
    :root {
        --bg-sage-light: #D8E2DC;          /* Primary Page Background */
        --card-mint-light: rgba(222, 234, 232, 0.75);
        --card-white: rgba(255, 255, 255, 0.85);
        
        --accent-eucalyptus: #97B1A6;      /* Highlight Color */
        --accent-btn-hover: #8EAFA0;       /* Hover Accent State */
        
        --text-primary: #11382B;           /* Deep Forest Green Headings */
        --text-body: #2D4A3E;              /* Readable Medium Forest Text */
        --text-muted: #5C7368;             /* Muted Grey-Green Text */
        
        --border-subtle: rgba(17, 56, 43, 0.12);
        --border-hover: rgba(151, 177, 166, 0.4);
        --radius-lg: 24px;
        --radius-md: 14px;
    }

    .register-page {
        min-height: calc(100vh - 128px);
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
    }

    /* Container Card background, box-shadow, and borders removed */
    .register-card {
        width: min(100%, 960px);
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        background: transparent;  /* Removed solid white card background */
        border: none;             /* Removed outer box border */
        box-shadow: none;         /* Removed box shadow */
        gap: 2rem;
    }

    /* Left Branding Banner - Box background removed */
    .register-intro {
        padding: 2rem;
        color: var(--text-primary);
        background: transparent; /* Removed mint box background */
        border-right: none;      /* Removed divider border */
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .intro-icon {
        font-size: 1.8rem;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .register-intro h1 {
        margin: 0.75rem 0 1rem;
        font-size: clamp(2rem, 3vw, 2.5rem);
        line-height: 1.2;
        font-family: var(--font-serif, 'Playfair Display', Georgia, serif);
        font-weight: 600;
        color: var(--text-primary);
    }

    .register-intro p {
        color: var(--text-muted);
        line-height: 1.7;
        font-size: 0.95rem;
        margin: 0;
    }

    /* Right Form Container - Box background removed */
    .register-form {
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: transparent; /* Removed solid white form background */
    }

    .register-form h2 {
        margin: 0 0 0.45rem;
        color: var(--text-primary);
        font-size: 1.8rem;
        font-weight: 700;
        font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
    }

    .subtitle {
        margin: 0 0 2rem;
        color: var(--text-muted);
        font-size: 0.925rem;
    }

    .field {
        margin-bottom: 1.25rem;
    }

    .field label {
        display: block;
        margin-bottom: 0.45rem;
        color: var(--text-primary);
        font-weight: 600;
        font-size: 0.875rem;
    }

    /* Glassy/Semi-transparent Form Inputs */
    .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.85rem 1rem;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        outline: none;
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.65); /* Semi-transparent fill */
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.25s ease;
        font-family: inherit;
    }

    .field input::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
    }

    .field input:focus {
        border-color: var(--accent-eucalyptus);
        box-shadow: 0 0 0 3px rgba(151, 177, 166, 0.25);
        background: var(--card-white);
    }

    /* Terms and Conditions Checkbox */
    .terms {
        display: flex;
        gap: 0.65rem;
        align-items: flex-start;
        margin: 0.75rem 0 1.75rem;
        color: var(--text-muted);
        font-size: 0.85rem;
        line-height: 1.5;
    }

    .terms input {
        margin-top: 0.2rem;
        accent-color: var(--accent-eucalyptus);
        cursor: pointer;
    }

    .terms a, .login-link a {
        color: var(--text-primary);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .terms a:hover, .login-link a:hover {
        color: var(--accent-eucalyptus);
        text-decoration: underline;
    }

    /* Primary Eucalyptus Button */
    .submit-button {
        width: 100%;
        padding: 0.95rem;
        border: 0;
        border-radius: 30px;
        color: var(--text-primary);
        background-color: var(--accent-eucalyptus);
        font-weight: 700;
        font-size: 0.95rem;
        font-family: inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(151, 177, 166, 0.35);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .submit-button:hover {
        transform: translateY(-2px);
        background-color: var(--accent-btn-hover);
        box-shadow: 0 6px 20px rgba(151, 177, 166, 0.5);
    }

    .submit-button:active {
        transform: translateY(0);
    }

    /* Footer Login Prompt */
    .login-link {
        margin: 1.75rem 0 0;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    @media (max-width: 768px) {
        .register-card {
            grid-template-columns: 1fr;
            gap: 0;
        }
        .register-intro {
            padding: 1.5rem 0.5rem;
            text-align: center;
        }
        .register-form {
            padding: 1.5rem 0.5rem;
        }
    }
</style>

<main class="register-page">
    <section class="register-card" aria-label="Create an account">
        <div class="register-intro">
            <div class="intro-icon">✦</div>
            <h1>Start your journey with us.</h1>
            <p>Create your account and discover a refined, personalized approach to private academic mentorship.</p>
        </div>
        <div class="register-form">
            <h2>Create your account</h2>
            <p class="subtitle">Join us today — it only takes a minute.</p>
            
            <form method="post" action="">

                <div class="field">
                    <label for="name">Full Name</label>
                    <input id="name" name="name" type="text" placeholder="Alex Morgan" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required>
                </div>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
                </label>

                <button class="submit-button" type="submit">Create account &rarr;</button>
            </form>

            <div class="login-link">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}">Sign in</a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
