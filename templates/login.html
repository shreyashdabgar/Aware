{% extends "index.html" %}

{% block content %}
<style>
    /* Design Tokens - Light Sage, Mint & Eucalyptus Palette */
    :root {
        --bg-sage-light: #D8E2DC;          /* Primary Page Background */
        --card-mint-light: rgba(222, 234, 232, 0.75);
        --card-white: rgba(255, 255, 255, 0.85);
        
        --accent-eucalyptus: #97B1A6;      /* Key Highlight Accent Color */
        --accent-btn-hover: #8EAFA0;       /* Primary Hover State */
        
        --text-primary: #11382B;           /* Deep Forest Green Headings */
        --text-body: #2D4A3E;              /* Readable Medium Forest Text */
        --text-muted: #5C7368;             /* Muted Grey-Green Text */
        
        --border-subtle: rgba(17, 56, 43, 0.12);
        --border-hover: rgba(151, 177, 166, 0.4);
        --radius-lg: 24px;
        --radius-md: 14px;
    }

    .login-page {
        min-height: calc(100vh - 128px);
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
    }

    /* Outer container - solid card backgrounds and borders removed */
    .login-card {
        width: min(100%, 960px);
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        background: transparent;
        border: none;
        box-shadow: none;
        gap: 2rem;
    }

    /* Left Branding Banner - Box background and borders removed */
    .login-intro {
        padding: 2rem;
        color: var(--text-primary);
        background: transparent;
        border-right: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .intro-icon {
        font-size: 1.8rem;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .login-intro h1 {
        margin: 0.75rem 0 1rem;
        font-size: clamp(2rem, 3vw, 2.5rem);
        line-height: 1.2;
        font-family: var(--font-serif, 'Playfair Display', Georgia, serif);
        font-weight: 600;
        color: var(--text-primary);
    }

    .login-intro p {
        color: var(--text-muted);
        line-height: 1.7;
        font-size: 0.95rem;
        margin: 0;
    }

    /* Right Form Container - Box background removed */
    .login-form {
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: transparent;
    }

    .login-form h2 {
        margin: 0 0 0.45rem;
        color: var(--text-primary);
        font-size: 1.8rem;
        font-weight: 700;
        font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
    }

    .subtitle {
        margin: 0 0 2rem;
        color: var(--text-muted);
        font-size: 0.925rem;
    }

    .field {
        margin-bottom: 1.25rem;
    }

    .field label {
        display: block;
        margin-bottom: 0.45rem;
        color: var(--text-primary);
        font-weight: 600;
        font-size: 0.875rem;
    }

    /* Glassy/Semi-transparent Form Inputs */
    .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.85rem 1rem;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        outline: none;
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.25s ease;
        font-family: inherit;
    }

    .field input::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
    }

    .field input:focus {
        border-color: var(--accent-eucalyptus);
        box-shadow: 0 0 0 3px rgba(151, 177, 166, 0.25);
        background: var(--card-white);
    }

    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0.75rem 0 1.75rem;
        font-size: 0.85rem;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-muted);
        cursor: pointer;
    }

    .remember-me input {
        accent-color: var(--accent-eucalyptus);
        cursor: pointer;
    }

    .forgot-link {
        color: var(--text-primary);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .forgot-link:hover {
        color: var(--accent-eucalyptus);
        text-decoration: underline;
    }

    /* Primary Eucalyptus Button */
    .submit-button {
        width: 100%;
        padding: 0.95rem;
        border: 0;
        border-radius: 30px;
        color: var(--text-primary);
        background-color: var(--accent-eucalyptus);
        font-weight: 700;
        font-size: 0.95rem;
        font-family: inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(151, 177, 166, 0.35);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .submit-button:hover {
        transform: translateY(-2px);
        background-color: var(--accent-btn-hover);
        box-shadow: 0 6px 20px rgba(151, 177, 166, 0.5);
    }

    .submit-button:active {
        transform: translateY(0);
    }

    /* Footer Register Prompt */
    .register-link {
        margin: 1.75rem 0 0;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .register-link a {
        color: var(--text-primary);
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .register-link a:hover {
        color: var(--accent-eucalyptus);
        text-decoration: underline;
    }

    @media (max-width: 768px) {
        .login-card {
            grid-template-columns: 1fr;
            gap: 0;
        }
        .login-intro {
            padding: 1.5rem 0.5rem;
            text-align: center;
        }
        .login-form {
            padding: 1.5rem 0.5rem;
        }
    }
</style>

<main class="login-page">
    <section class="login-card" aria-label="Sign in to your account">
        <div class="login-intro">
            <div class="intro-icon">✦</div>
            <h1>Welcome back.</h1>
            <p>Access your personalized dashboard, connect with elite tutors, and resume your academic journey.</p>
        </div>
        <div class="login-form">
            <h2>Sign in</h2>
            <p class="subtitle">Please enter your credentials to access your account.</p>
            
            <form method="post" action="">
                
                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember_me">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button class="submit-button" type="submit">Sign in &rarr;</button>
            </form>

            <div class="register-link">
                Don't have an account? 
                <a href="{{ url_for('auth.register') }}">Get Started</a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
