{% extends "index.html" %}

{% block title %}Upload Video — Aware{% endblock %}

{% block content %}
<style>
    /* Design Tokens - Light Sage, Mint & Eucalyptus Palette */
    :root {
        --bg-sage-light: #D8E2DC;          /* Primary Page Background */
        --card-mint-light: rgba(222, 234, 232, 0.75); /* Soft semi-transparent drop zone */
        --card-white: rgba(255, 255, 255, 0.85);
        
        --accent-eucalyptus: #97B1A6;      /* Key Accent Color */
        --accent-btn-hover: #8EAFA0;       /* Hover Accent State */
        
        --text-primary: #11382B;           /* Deep Forest Green Headings */
        --text-body: #2D4A3E;              /* Medium Forest Text */
        --text-muted: #5C7368;             /* Muted Grey-Green Text */
        
        --border-subtle: rgba(17, 56, 43, 0.12);
        --border-hover: rgba(151, 177, 166, 0.5);
        --radius-lg: 24px;
        --radius-md: 14px;
    }

    .upload-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem 4rem;
        min-height: calc(100vh - 200px);
    }

    /* Solid card background, border, and shadow removed */
    .upload-card {
        width: 100%;
        max-width: 580px;
        padding: 1rem;
        background: transparent;
        border: none;
        box-shadow: none;
    }

    .upload-card h1 {
        font-family: var(--font-serif, 'Playfair Display', Georgia, serif);
        font-size: 2rem;
        color: var(--text-primary);
        margin: 0 0 1.75rem;
        text-align: center;
        font-weight: 600;
    }

    /* 1. Video file selector zone - semi-transparent backdrop */
    .drop-zone {
        border: 2px dashed var(--accent-eucalyptus);
        border-radius: var(--radius-md);
        padding: 2.5rem 1.5rem;
        text-align: center;
        background: rgba(222, 234, 232, 0.45);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 1.5rem;
    }

    .drop-zone:hover {
        border-color: var(--text-primary);
        background: rgba(212, 227, 224, 0.65);
    }

    .drop-icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
        display: block;
    }

    .drop-text {
        color: var(--text-primary);
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 0.25rem;
    }

    .drop-subtext {
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .file-name-preview {
        margin-top: 0.75rem;
        font-weight: 600;
        color: var(--text-primary);
        font-size: 0.875rem;
        word-break: break-all;
    }

    /* 2. Video title field */
    .field {
        margin-bottom: 1.75rem;
    }

    .field label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
        font-weight: 600;
        font-size: 0.875rem;
    }

    /* Glassy/Semi-transparent Input */
    .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.85rem 1rem;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        outline: none;
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.25s ease;
        font-family: inherit;
    }

    .field input::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
    }

    .field input:focus {
        border-color: var(--accent-eucalyptus);
        box-shadow: 0 0 0 3px rgba(151, 177, 166, 0.25);
        background: var(--card-white);
    }

    /* 3. Primary Eucalyptus Button */
    .btn-submit {
        width: 100%;
        padding: 0.95rem;
        border: 0;
        border-radius: 30px;
        color: var(--text-primary);
        background-color: var(--accent-eucalyptus);
        font-weight: 700;
        font-size: 0.95rem;
        font-family: inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(151, 177, 166, 0.35);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn-submit:hover {
        background-color: var(--accent-btn-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(151, 177, 166, 0.5);
    }

    .btn-submit:active {
        transform: translateY(0);
    }

    #video_file {
        display: none;
    }
</style>

<div class="upload-container">
    <div class="upload-card">
        <h1>🎥 Upload Video</h1>

        <form method="post" action="{{ url_for('main.upload_video') if url_for is defined else '#' }}" enctype="multipart/form-data">
            
            <!-- Hidden Input Triggered by Click -->
            <input type="file" id="video_file" name="video_file" accept="video/*" required>

            <!-- 1. Video file selector 🎥 -->
            <div class="drop-zone" onclick="document.getElementById('video_file').click();">
                <span class="drop-icon">🎥</span>
                <div class="drop-text">Select Video File</div>
                <div class="drop-subtext">Click to open laptop files</div>
                <div class="file-name-preview" id="file-name-preview"></div>
            </div>

            <!-- 2. Video title -->
            <div class="field">
                <label for="title">Video Title</label>
                <input id="title" name="title" type="text" placeholder="Enter video title..." required>
            </div>

            <!-- 3. Upload button -->
            <button type="submit" class="btn-submit">Upload Video</button>

        </form>
    </div>
</div>

<script>
    const fileInput = document.getElementById('video_file');
    const filePreview = document.getElementById('file-name-preview');

    fileInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            filePreview.textContent = 'Selected File: ' + this.files[0].name;
        }
    });
</script>
{% endblock %}
